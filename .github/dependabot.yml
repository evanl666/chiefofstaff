version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates together; a major update comes on its own, to review by itself.
      python:
        patterns: ["*"]
        update-types: [minor, patch]
