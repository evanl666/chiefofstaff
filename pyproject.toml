[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "chiefofstaff"
version = "0.1.22"
description = "One inbox for all your GitHub Copilot sessions: tasks and follow-ups go to the right session, Slack replies wait for your approval, and finished work waits for your review."
license = "MIT"
dynamic = ["readme"]
license-files = ["LICENSE"]
authors = [{ name = "evanl666" }]
requires-python = ">=3.11"
keywords = ["github-copilot", "ai-agents", "multi-agent", "orchestration", "slack", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "platformdirs>=4,<5",
  "keyring>=25,<26",
  "mcp>=1.24,<2",
  "github-copilot-sdk>=1.0.28,<1.1",
  "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/evanl666/chiefofstaff"
Issues = "https://github.com/evanl666/chiefofstaff/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pyright==1.1.414",
]

[project.scripts]
chiefofstaff = "chiefofstaff.__main__:main"

# The README links images and docs relatively, which works on GitHub (private or public); PyPI
# gets absolute links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/evanl666/chiefofstaff/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/evanl666/chiefofstaff/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/chiefofstaff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["copilot: runs against the real GitHub Copilot CLI (set CHIEFOFSTAFF_TEST_COPILOT=1)"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "PIE", "RET", "C4", "PERF"]
# The UI shows deletions as "−12", with a real minus sign.
allowed-confusables = ["−"]
# Word lists read better as one string.split() than as a column of literals; a loop that
# appends reads better than extend() with a generator, and speed does not matter there.
ignore = ["SIM905", "PERF401"]

[tool.ruff.lint.per-file-ignores]
# Test drivers deliberately block on processes and files.
"scripts/*" = ["ASYNC"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
