[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "chiefofstaff"
version = "0.1.38"
description = "One inbox for all your GitHub Copilot sessions: tasks and follow-ups go to the right session, Slack replies wait for your approval, and finished work waits for your review."
license = "MIT"
dynamic = ["readme"]
license-files = ["LICENSE"]
authors = [{ name = "evanl666" }]
requires-python = ">=3.11"
keywords = ["github-copilot", "ai-agents", "multi-agent", "orchestration", "slack", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "platformdirs>=4,<5",
  "keyring>=25,<26",
  "mcp>=1.24,<2",
  "github-copilot-sdk>=1.0.28,<1.1",
  "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/evanl666/chiefofstaff"
Issues = "https://github.com/evanl666/chiefofstaff/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pyright==1.1.414",
]

[project.scripts]
chiefofstaff = "chiefofstaff.__main__:main"

# The README links images and docs relatively, which works on GitHub (private or public); PyPI
# gets absolute links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/evanl666/chiefofstaff/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/evanl666/chiefofstaff/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/chiefofstaff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "copilot: runs against the real GitHub Copilot CLI (set CHIEFOFSTAFF_TEST_COPILOT=1)",
    "titles: new tasks' titles are checked as in use (other tests name tasks tersely)",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "PIE", "RET", "C4", "PERF",
    "S", "A", "DTZ", "T20", "N", "PT", "PTH", "FURB", "ERA", "PGH", "G", "LOG",
]
# The UI shows deletions as "−12", with a real minus sign.
allowed-confusables = ["−"]
# Word lists read better as one string.split() than as a column of literals; a loop that
# appends reads better than extend() with a generator, and speed does not matter there.
ignore = ["SIM905", "PERF401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # Asserts are how pytest checks.
    "S105", "S107",  # Fake tokens and passwords.
    "S108",  # Made-up /tmp paths: nothing is written there.
    "S603", "S607",  # Tests run git to set up repositories.
    "PT018",  # A composite assert reads as one fact about a result.
]
"scripts/*" = [
    "ASYNC",  # Test drivers deliberately block on processes and files.
    "S101",  # Drivers check what they see with asserts.
    "S105", "S106",  # Fake tokens for the fake servers.
    "S108",  # /tmp: made-up paths in scripted content, and where a live run leaves its logs.
    "S311",  # Seeded random test data, not secrets.
    "S603", "S607",  # Drivers run git, gh and the app.
    "T201",  # Drivers print their progress.
    "PT017", "PT018",  # Not pytest: drivers assert on what an error says, several facts at once.
]
# The command line prints where Chief of Staff runs.
"src/chiefofstaff/__main__.py" = ["T201"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
