[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "work-buddy-local"
version = "0.1.0"
description = "A Router that coordinates your Copilot sessions, Slack and GitHub reviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "platformdirs>=4,<5",
  "keyring>=25,<26",
  "mcp>=1.24,<2",
  "github-copilot-sdk>=1.0.28,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
work-buddy = "work_buddy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/work_buddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test drivers deliberately block on processes and files.
"scripts/*" = ["ASYNC"]
